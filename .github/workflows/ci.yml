name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    env:
      SHARED_SCHEMA_REPO_URL: https://github.com/todays-nail/shared-schema.git
      SHARED_SCHEMA_REF: 1c1a08472bd9f0ef0f77e730ec7557bd0ac4a829
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate migration filenames
        run: node scripts/supabase-migrations-lint.mjs

      - name: Validate shared-schema sync
        run: node scripts/supabase-db-sync-from-shared.mjs --check

  build:
    needs: schema-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
