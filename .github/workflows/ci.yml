name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SUBMODULE_PAT secret
        run: |
          if [ -z "${{ secrets.SUBMODULE_PAT }}" ]; then
            echo "::error::Missing Actions secret SUBMODULE_PAT."
            echo "::error::SUBMODULE_PAT must have read access to todays-nail/shared-schema for private submodule checkout."
            echo "::error::Add it in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: true
          submodules: recursive

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate migration filenames
        run: node scripts/supabase-migrations-lint.mjs

      - name: Validate shared-schema sync
        run: node scripts/supabase-db-sync-from-shared.mjs --check

  build:
    needs: schema-validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate SUBMODULE_PAT secret
        run: |
          if [ -z "${{ secrets.SUBMODULE_PAT }}" ]; then
            echo "::error::Missing Actions secret SUBMODULE_PAT."
            echo "::error::SUBMODULE_PAT must have read access to todays-nail/shared-schema for private submodule checkout."
            echo "::error::Add it in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: true
          submodules: recursive

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
